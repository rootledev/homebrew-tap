name: test

# Tap CI: Linux x86_64 only (including WSL users). Weekly cron catches
# bit rot in the source build even with no pushes. Historical macOS
# releases remain available, but the cask is no longer maintained.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this repo locally
        run: |
          tapdir="$(brew --repository rootledev/tap)"
          mkdir -p "$(dirname "$tapdir")"
          ln -sfn "$PWD" "$tapdir"
          brew tap | grep rootledev/tap

      - name: Style
        run: brew style rootledev/tap

      - name: Audit
        run: brew audit --new --formula rootledev/tap/rootle

      - name: Install from source
        run: brew install --verbose --build-from-source rootledev/tap/rootle

      - name: Test
        run: brew test rootledev/tap/rootle
